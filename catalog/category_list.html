{% extends "base.html" %}
{% block title %}Categories - SakoraFlow{% endblock %}
{% block content %}
<div class="toolbar"><h1>Categories</h1><div class="actions"><a class="btn ghost" href="{% url 'product_list' %}">Products</a></div></div>
<div class="cols">
  <div class="card">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "_form.html" %}
      <button type="submit">Add category</button>
    </form>
  </div>
  <table class="data">
    <thead><tr><th>Name</th><th></th></tr></thead>
    <tbody>
    {% for c in categories %}
      <tr>
        <td>{{ c.name }}</td>
        <td class="num">
          <form method="post" class="inline" onsubmit="return confirm('Remove this category? Products keep existing but become uncategorised.');">
            {% csrf_token %}<input type="hidden" name="delete" value="{{ c.pk }}"><button type="submit">Remove</button>
          </form>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="2" class="muted">No categories yet.</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
