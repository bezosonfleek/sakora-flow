{% extends "base.html" %}
{% block title %}{{ title }} - SakoraFlow{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>{{ title }}</h1>
  {% if intro %}<p>{{ intro }}</p>{% endif %}
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "_form.html" %}
    <button type="submit">{{ submit|default:"Save" }}</button>
    {% if back %}<a class="link" href="{{ back }}">Cancel</a>{% endif %}
  </form>
</div>
{% endblock %}
